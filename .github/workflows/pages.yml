name: Deploy Web Lab to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy CIBERSOC GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage static site bundle
        run: |
          mkdir -p _site/demo
          cp docs/demo/index.html _site/index.html
          cp docs/demo/index.html _site/demo/index.html
          cp -R assets _site/assets
          cp -R docs/en-GB _site/en-GB
          cp -R docs/pt _site/pt
          cp -R docs/es _site/es
          printf "static\n" > _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
